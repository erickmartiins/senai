<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI - Controle de Estoque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        senai: {
                            blue: '#002E5F',    
                            red: '#E02B20',     
                            light: '#F8FAFC',   
                            dark: '#0B1120'
                        }
                    },
                    boxShadow: {
                        'soft-md': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'soft-lg': '0 10px 30px -3px rgba(0, 0, 0, 0.08)',
                        'soft-xl': '0 20px 40px -5px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('senaiTheme') === 'dark' || (!('senaiTheme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: transparent; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        .dark .table-container::-webkit-scrollbar-thumb { background: #334155; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark .table-container::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.7);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 h-screen flex flex-col font-sans overflow-hidden transition-colors duration-300 selection:bg-senai-blue selection:text-white">

    <header class="bg-gradient-to-r from-senai-blue to-blue-950 dark:from-slate-900 dark:to-slate-950 text-white shadow-soft-md z-20 relative">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-5">
                <!-- Logótipo do SENAI atualizado com a imagem -->
                <div class="bg-white/10 backdrop-blur-md p-2 rounded-xl shadow-inner border border-white/10 flex items-center justify-center transform transition hover:scale-105">
                    <div class="h-12 bg-white rounded-lg flex items-center justify-center px-2 py-1">
                        <img src="marca_SENAI_2024_completa colorida.png" alt="Logotipo SENAI" class="h-full w-auto object-contain max-w-[140px]">
                    </div>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-blue-200 tracking-tight">Controle de Estoque</h1>
                    <p class="text-xs text-blue-300 font-semibold tracking-widest uppercase mt-0.5 opacity-80">Sistema de Gestão Interna</p>
                </div>
            </div>
            <div class="flex items-center gap-5">
                <div class="flex items-center gap-2 text-xs font-bold text-emerald-300 bg-white/10 backdrop-blur-md px-4 py-2 rounded-full hidden sm:flex border border-white/5">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    Sincronizado
                </div>
                <button onclick="toggleTheme()" class="h-10 w-10 flex items-center justify-center text-white bg-white/10 hover:bg-white/20 border border-white/10 rounded-xl transition-all duration-200 hover:-translate-y-0.5 shadow-lg" title="Alternar Tema Claro/Escuro">
                    <i class="ph ph-moon text-xl dark:hidden"></i>
                    <i class="ph ph-sun text-xl hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-[1400px] mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex flex-col overflow-hidden gap-6 relative z-10">
        
        <!-- Tabs -->
        <div class="flex gap-2 shrink-0 border-b border-slate-200 dark:border-slate-800 pb-px">
            <button id="tabEquipamentos" onclick="switchTab('equipamentos')" class="relative px-6 py-3 font-bold text-sm rounded-t-xl transition-all flex items-center gap-2 bg-white dark:bg-slate-900 text-senai-blue dark:text-blue-400 border border-b-0 border-slate-200 dark:border-slate-700 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
                <i class="ph-fill ph-wrench text-xl"></i>
                Equipamentos / Máquinas
                <div class="absolute bottom-[-2px] left-0 right-0 h-0.5 bg-white dark:bg-slate-900"></div>
            </button>
            <button id="tabInsumos" onclick="switchTab('insumos')" class="relative px-6 py-3 font-bold text-sm rounded-t-xl transition-all flex items-center gap-2 text-slate-500 hover:text-slate-700 hover:bg-white/50 dark:text-slate-400 dark:hover:text-slate-200 dark:hover:bg-slate-800 z-0">
                <i class="ph-fill ph-package text-xl"></i>
                Insumos
                <div class="absolute bottom-[-2px] left-0 right-0 h-0.5 bg-transparent transition-colors"></div>
            </button>
        </div>

        <!-- Toolbar -->
        <div class="glass-panel p-5 rounded-2xl shadow-soft-lg border border-slate-200/60 dark:border-slate-700/60 flex flex-col xl:flex-row gap-5 justify-between items-end shrink-0 transition-all duration-300">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 w-full xl:w-auto flex-1">
                <div class="flex flex-col">
                    <label class="text-[10px] font-extrabold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-widest">Buscar</label>
                    <div class="relative">
                        <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="text" id="searchInput" placeholder="Nome, Património ou Obs..." class="w-full pl-10 pr-4 py-2.5 bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:border-senai-blue dark:focus:border-blue-500 focus:ring-4 focus:ring-senai-blue/10 dark:focus:ring-blue-500/20 transition-all placeholder-slate-400">
                    </div>
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-extrabold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-widest">Ambiente</label>
                    <select id="filterAmbiente" class="w-full px-4 py-2.5 bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all appearance-none">
                        <option value="">Todos os Ambientes</option>
                        <option value="Núcleo Didático">Núcleo Didático</option>
                        <option value="Laboratório de Automação 2">Laboratório de Automação 2</option>
                        <option value="Laboratório de Acionamentos 3">Laboratório de Acionamentos 3</option>
                        <option value="Laboratório de Acionamentos 4">Laboratório de Acionamentos 4</option>
                        <option value="Laboratório de Manufatura">Laboratório de Manufatura</option>
                        <option value="Laboratório Predial">Laboratório Predial</option>
                        <option value="Sala 7">Sala 7</option>
                        <option value="Sala 17">Sala 17</option>
                        <option value="Recurso Didático">Recurso Didático</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-extrabold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-widest">Situação</label>
                    <select id="filterSituacao" class="w-full px-4 py-2.5 bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all">
                        <option value="">Todas as Situações</option>
                        <option value="OK">OK</option>
                        <option value="Precisa repor">Precisa repor</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-extrabold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-widest">Categoria</label>
                    <select id="filterCategoria" class="w-full px-4 py-2.5 bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all">
                        <option value="">Todas as Categorias</option>
                    </select>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 w-full xl:w-auto mt-4 xl:mt-0">
                <button onclick="exportarExcelCompleto()" class="bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all shadow-md shadow-emerald-500/20 hover:shadow-lg hover:shadow-emerald-500/40 hover:-translate-y-0.5 w-full sm:w-auto justify-center whitespace-nowrap">
                    <i class="ph-fill ph-microsoft-excel-logo text-xl"></i>
                    Exportar Completo
                </button>
                <button onclick="openModal()" class="bg-gradient-to-r from-senai-blue to-blue-800 hover:from-blue-800 hover:to-blue-950 text-white px-6 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all shadow-md shadow-blue-900/20 hover:shadow-lg hover:shadow-blue-900/40 hover:-translate-y-0.5 w-full sm:w-auto justify-center whitespace-nowrap">
                    <i class="ph-fill ph-plus-circle text-xl"></i>
                    Novo Item
                </button>
            </div>
        </div>

        <!-- Tabela -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-soft-xl border border-slate-200/50 dark:border-slate-800/50 flex-1 overflow-hidden flex flex-col transition-all duration-300">
            <div class="table-container overflow-auto flex-1 relative">
                <table class="w-full text-left border-collapse min-w-[1150px]">
                    <thead class="bg-slate-50/80 dark:bg-slate-800/80 backdrop-blur-md sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                        <tr>
                            <th id="thPatrimonio" class="py-4 px-5 text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest w-32">Património</th>
                            <th class="py-4 px-5 text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest">Nome do Item</th>
                            <th class="py-4 px-5 text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest">Categoria</th>
                            <th class="py-4 px-5 text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest w-24 text-center">Qtd</th>
                            <th class="py-4 px-5 text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest">Ambiente</th>
                            <th class="py-4 px-5 text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest w-28">Valor Aprox.</th>
                            <th class="py-4 px-5 text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest w-36">Situação</th>
                            <th class="py-4 px-5 text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest w-36 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-800/50">
                        <!-- Itens renderizados via JS -->
                    </tbody>
                </table>
            </div>
            
            <div class="bg-slate-50/50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-800 p-4 text-xs font-semibold text-slate-500 flex justify-between items-center">
                <span id="itemCount" class="bg-white dark:bg-slate-800 px-3 py-1 rounded-full shadow-sm border border-slate-200 dark:border-slate-700">0 itens encontrados</span>
                <span class="flex items-center gap-1.5"><i class="ph-fill ph-hard-drives text-slate-400"></i> Armazenamento Local Ativo</span>
            </div>
        </div>
    </main>

    <!-- Modal Novo/Editar Item -->
    <div id="itemModal" class="fixed inset-0 bg-slate-900/40 dark:bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[90vh] transform scale-95 transition-all duration-300 border border-slate-200 dark:border-slate-800" id="itemModalContent">
            
            <div class="px-7 py-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-white dark:bg-slate-900">
                <h2 id="modalTitle" class="text-xl font-black text-senai-blue dark:text-blue-400 flex items-center gap-2">
                    <i class="ph-fill ph-box-arrow-down"></i> Adicionar Novo Item
                </h2>
                <button onclick="closeModal()" class="h-8 w-8 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>

            <div class="p-7 overflow-y-auto flex-1 bg-slate-50/50 dark:bg-slate-900/30">
                <form id="itemForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <input type="hidden" id="itemId">
                    
                    <div class="col-span-1 md:col-span-2 lg:col-span-3">
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Nome do Item *</label>
                        <input type="text" id="nome" required class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all placeholder-slate-400 shadow-sm" placeholder="Ex: Multímetro Digital">
                    </div>

                    <div id="patrimonioContainer">
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Património</label>
                        <input type="text" id="patrimonio" class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all placeholder-slate-400 shadow-sm" placeholder="Ex: SEN-12345">
                    </div>

                    <div class="col-span-1 md:col-span-2 lg:col-span-1">
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Categoria *</label>
                        <input type="text" id="categoria" required class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all placeholder-slate-400 shadow-sm" placeholder="Ex: Instrumentação">
                    </div>

                    <div class="grid grid-cols-2 gap-4 col-span-1 md:col-span-1">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Quantidade *</label>
                            <input type="number" id="quantidade" required min="0" step="0.01" class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all shadow-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Unidade *</label>
                            <input type="text" id="unidade" required class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all placeholder-slate-400 shadow-sm" placeholder="pç, kg...">
                        </div>
                    </div>

                    <div class="col-span-1 md:col-span-1 lg:col-span-1">
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Ambiente *</label>
                        <select id="ambiente" required class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all shadow-sm appearance-none">
                            <option value="">Selecione...</option>
                            <option value="Núcleo Didático">Núcleo Didático</option>
                            <option value="Laboratório de Automação 2">Laboratório de Automação 2</option>
                            <option value="Laboratório de Acionamentos 3">Laboratório de Acionamentos 3</option>
                            <option value="Laboratório de Acionamentos 4">Laboratório de Acionamentos 4</option>
                            <option value="Laboratório de Manufatura">Laboratório de Manufatura</option>
                            <option value="Laboratório Predial">Laboratório Predial</option>
                            <option value="Sala 7">Sala 7</option>
                            <option value="Sala 17">Sala 17</option>
                            <option value="Recurso Didático">Recurso Didático</option>
                        </select>
                    </div>

                    <div class="col-span-1 md:col-span-1 lg:col-span-1">
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Valor Aprox. Unitário (R$)</label>
                        <input type="number" id="valorMercado" min="0" step="0.01" class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all shadow-sm" placeholder="Ex: 150.00">
                    </div>

                    <div class="col-span-1 md:col-span-1 lg:col-span-1">
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Situação *</label>
                        <select id="situacao" required class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all shadow-sm appearance-none">
                            <option value="OK">OK</option>
                            <option value="Precisa repor">Precisa repor</option>
                        </select>
                    </div>

                    <div class="col-span-1 md:col-span-2 lg:col-span-3">
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Observações</label>
                        <textarea id="observacoes" rows="2" class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-sm font-medium focus:outline-none focus:border-senai-blue focus:ring-4 focus:ring-senai-blue/10 transition-all placeholder-slate-400 shadow-sm resize-none" placeholder="Detalhes, estado de conservação, onde está guardado..."></textarea>
                    </div>
                </form>
            </div>

            <div class="px-7 py-5 border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-6 py-2.5 text-sm font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-all">
                    Cancelar
                </button>
                <button type="submit" form="itemForm" class="px-6 py-2.5 text-sm font-bold bg-gradient-to-r from-senai-blue to-blue-800 text-white rounded-xl transition-all shadow-md shadow-blue-900/20 hover:shadow-lg hover:shadow-blue-900/40 hover:-translate-y-0.5 flex items-center gap-2">
                    <i class="ph-fill ph-floppy-disk text-lg"></i> Guardar Item
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Confirmação de Exclusão -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/40 dark:bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden p-8 text-center transform scale-95 transition-all duration-200 border border-slate-200 dark:border-slate-800" id="confirmModalContent">
            <div class="w-20 h-20 bg-red-50 dark:bg-red-900/20 rounded-full flex items-center justify-center mx-auto mb-5 text-red-500 shadow-inner">
                <i class="ph-fill ph-trash text-4xl"></i>
            </div>
            <h3 class="text-xl font-black text-slate-800 dark:text-slate-100 mb-2">Excluir Item?</h3>
            <p class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-8">Esta ação é permanente e não poderá ser desfeita. Deseja mesmo continuar?</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeConfirmModal()" class="flex-1 px-4 py-3 text-sm font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-all">
                    Cancelar
                </button>
                <button id="confirmDeleteBtn" class="flex-1 px-4 py-3 text-sm font-bold bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white rounded-xl transition-all shadow-md shadow-red-500/20 hover:shadow-lg hover:-translate-y-0.5">
                    Sim, excluir
                </button>
            </div>
        </div>
    </div>

    <script>
        // Lógica de Tema
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('senaiTheme', html.classList.contains('dark') ? 'dark' : 'light');
        }

        const defaultData = [
            { id: '1', tipo: 'equipamentos', patrimonio: 'SEN-EL-001', nome: 'Chave de Impacto Brushless 48V', categoria: 'Ferramentas Elétricas', quantidade: 2, unidade: 'pç', ambiente: 'Laboratório de Automação 2', valorMercado: 289.90, situacao: 'OK', observacoes: 'Maleta completa com 2 baterias', fixado: false },
            { id: '2', tipo: 'equipamentos', patrimonio: 'SEN-IN-001', nome: 'Multímetro Digital True RMS', categoria: 'Instrumentação', quantidade: 12, unidade: 'pç', ambiente: 'Laboratório de Manufatura', valorMercado: 135.00, situacao: 'OK', observacoes: 'Cabos de prova novos', fixado: false },
            { id: '3', tipo: 'insumos', patrimonio: '', nome: 'Fita Isolante Preta 20m', categoria: 'Insumos', quantidade: 3, unidade: 'rolo', ambiente: 'Sala 17', valorMercado: 9.50, situacao: 'Precisa repor', observacoes: 'Estoque mínimo é 10 rolos', fixado: false },
            { id: '4', tipo: 'equipamentos', patrimonio: 'SEN-MA-005', nome: 'Torno Mecânico Didático', categoria: 'Máquinas Pesadas', quantidade: 1, unidade: 'pç', ambiente: 'Laboratório de Manufatura', valorMercado: 18500.00, situacao: 'OK', observacoes: 'Revisado em 10/2023', fixado: true }
        ];

        let currentTab = 'equipamentos';
        let allItems = [];

        try {
            const stored = localStorage.getItem('senaiEstoqueData');
            if (stored) {
                allItems = JSON.parse(stored).map(item => ({...item, tipo: item.tipo || (item.patrimonio ? 'equipamentos' : 'insumos'), fixado: item.fixado || false}));
                
                // ATUALIZAÇÃO INTELIGENTE DE PREÇOS PESQUISADOS
                const precosPesquisados = {
                    'Chave de Impacto Brushless 48V': 289.90,
                    'Multímetro Digital True RMS': 135.00,
                    'Fita Isolante Preta 20m': 9.50,
                    'Torno Mecânico Didático': 18500.00
                };
                
                let mudou = false;
                allItems = allItems.map(item => {
                    if (precosPesquisados[item.nome] && (!item.valorMercado || item.valorMercado === 350 || item.valorMercado === 120.5 || item.valorMercado === 8.9 || item.valorMercado === 15000)) {
                        mudou = true;
                        return { ...item, valorMercado: precosPesquisados[item.nome] };
                    }
                    return item;
                });
                
                if (mudou) localStorage.setItem('senaiEstoqueData', JSON.stringify(allItems));

            } else { allItems = defaultData; }
        } catch(e) { allItems = defaultData; }

        let itemToDeleteId = null;

        function saveToLocalStorage() {
            localStorage.setItem('senaiEstoqueData', JSON.stringify(allItems));
            renderTable();
            updateCategoryFilter();
        }

        function switchTab(tab) {
            currentTab = tab;
            const tabEq = document.getElementById('tabEquipamentos');
            const tabIn = document.getElementById('tabInsumos');
            const thPatrimonio = document.getElementById('thPatrimonio');
            const searchInput = document.getElementById('searchInput');

            const baseClasses = "relative px-6 py-3 font-bold text-sm rounded-t-xl transition-all flex items-center gap-2";
            const activeClasses = `${baseClasses} bg-white dark:bg-slate-900 text-senai-blue dark:text-blue-400 border border-b-0 border-slate-200 dark:border-slate-700 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10`;
            const inactiveClasses = `${baseClasses} text-slate-500 hover:text-slate-700 hover:bg-white/50 dark:text-slate-400 dark:hover:text-slate-200 dark:hover:bg-slate-800 z-0 border-transparent`;

            if (tab === 'equipamentos') {
                tabEq.className = activeClasses; tabIn.className = inactiveClasses;
                tabEq.querySelector('div').className = "absolute bottom-[-2px] left-0 right-0 h-0.5 bg-white dark:bg-slate-900";
                tabIn.querySelector('div').className = "absolute bottom-[-2px] left-0 right-0 h-0.5 bg-transparent";
                thPatrimonio.classList.remove('hidden'); searchInput.placeholder = "Nome, Património ou Obs...";
            } else {
                tabIn.className = activeClasses; tabEq.className = inactiveClasses;
                tabIn.querySelector('div').className = "absolute bottom-[-2px] left-0 right-0 h-0.5 bg-white dark:bg-slate-900";
                tabEq.querySelector('div').className = "absolute bottom-[-2px] left-0 right-0 h-0.5 bg-transparent";
                thPatrimonio.classList.add('hidden'); searchInput.placeholder = "Nome ou Obs...";
            }

            updateCategoryFilter(); renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const fAmbiente = document.getElementById('filterAmbiente').value;
            const fSituacao = document.getElementById('filterSituacao').value;
            const fCategoria = document.getElementById('filterCategoria').value;

            let filtered = allItems.filter(item => {
                const matchTab = item.tipo === currentTab;
                const matchSearch = (item.nome || '').toLowerCase().includes(search) || 
                                    (currentTab === 'equipamentos' && (item.patrimonio || '').toLowerCase().includes(search)) ||
                                    (item.observacoes || '').toLowerCase().includes(search);
                return matchTab && matchSearch && 
                       (fAmbiente === '' || item.ambiente === fAmbiente) &&
                       (fSituacao === '' || item.situacao === fSituacao) &&
                       (fCategoria === '' || item.categoria === fCategoria);
            });

            filtered.sort((a, b) => (b.fixado ? 1 : 0) - (a.fixado ? 1 : 0));
            document.getElementById('itemCount').innerText = `${filtered.length} itens encontrados`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${currentTab === 'equipamentos' ? 8 : 7}" class="py-16 text-center">
                    <div class="flex flex-col items-center justify-center opacity-60">
                        <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-4">
                            <i class="ph ph-magnifying-glass text-3xl text-slate-400"></i>
                        </div>
                        <p class="text-slate-500 dark:text-slate-400 font-medium">Nenhum item encontrado com estes filtros.</p>
                    </div>
                </td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((item, index) => {
                const situacaoBadge = item.situacao === 'OK' 
                    ? '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-emerald-100/80 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-400 border border-emerald-200/50 dark:border-emerald-500/20"><i class="ph-fill ph-check-circle"></i> OK</span>'
                    : '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-amber-100/80 text-amber-700 dark:bg-amber-500/10 dark:text-amber-400 border border-amber-200/50 dark:border-amber-500/20"><i class="ph-fill ph-warning-circle"></i> Precisa repor</span>';

                const obs = item.observacoes ? `<div class="text-xs text-slate-400 font-medium mt-1 truncate max-w-xs" title="${item.observacoes}">${item.observacoes}</div>` : '';
                const pinIco = item.fixado ? '<i class="ph-fill ph-push-pin text-amber-500"></i>' : '';
                
                const valorFormatado = item.valorMercado ? `R$ ${parseFloat(item.valorMercado).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : '-';

                const pinBtn = item.fixado 
                    ? `<button onclick="toggleFixar('${item.id}')" class="h-8 w-8 flex items-center justify-center text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 rounded-lg transition-colors" title="Desfixar"><i class="ph-fill ph-push-pin-slash"></i></button>`
                    : `<button onclick="toggleFixar('${item.id}')" class="h-8 w-8 flex items-center justify-center text-slate-400 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-500/10 rounded-lg transition-colors" title="Fixar no topo"><i class="ph ph-push-pin"></i></button>`;

                return `
                <tr class="${item.fixado ? 'bg-amber-50/30 dark:bg-amber-900/5' : 'hover:bg-slate-50 dark:hover:bg-slate-800/40'} transition-colors animate-slide-up group" style="animation-delay: ${index * 0.03}s">
                    ${currentTab === 'equipamentos' ? `<td class="py-4 px-5 border-b border-slate-100 dark:border-slate-800 font-bold text-xs text-slate-500 dark:text-slate-400">${item.patrimonio || '-'}</td>` : ''}
                    <td class="py-4 px-5 border-b border-slate-100 dark:border-slate-800">
                        <div class="text-sm font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">${pinIco} ${item.nome}</div>
                        ${obs}
                    </td>
                    <td class="py-4 px-5 border-b border-slate-100 dark:border-slate-800">
                        <span class="inline-flex px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">${item.categoria}</span>
                    </td>
                    <td class="py-4 px-5 border-b border-slate-100 dark:border-slate-800 text-center">
                        <span class="text-sm font-black text-senai-blue dark:text-blue-400">${item.quantidade}</span>
                        <span class="text-xs font-semibold text-slate-400 ml-0.5">${item.unidade}</span>
                    </td>
                    <td class="py-4 px-5 border-b border-slate-100 dark:border-slate-800 text-xs font-semibold text-slate-600 dark:text-slate-300">${item.ambiente}</td>
                    <td class="py-4 px-5 border-b border-slate-100 dark:border-slate-800 text-xs font-bold text-emerald-600 dark:text-emerald-400">${valorFormatado}</td>
                    <td class="py-4 px-5 border-b border-slate-100 dark:border-slate-800">${situacaoBadge}</td>
                    <td class="py-4 px-5 border-b border-slate-100 dark:border-slate-800">
                        <div class="flex items-center justify-end gap-1 ${item.fixado ? '' : 'opacity-0 group-hover:opacity-100'} transition-opacity">
                            ${pinBtn}
                            <button onclick="editItem('${item.id}')" class="h-8 w-8 flex items-center justify-center text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-500/10 rounded-lg transition-colors" title="Editar"><i class="ph-fill ph-pencil-simple"></i></button>
                            <button onclick="requestDelete('${item.id}')" class="h-8 w-8 flex items-center justify-center text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 rounded-lg transition-colors" title="Excluir"><i class="ph-fill ph-trash"></i></button>
                        </div>
                    </td>
                </tr>`
            }).join('');
        }

        function updateCategoryFilter() {
            const select = document.getElementById('filterCategoria');
            const val = select.value;
            const cats = [...new Set(allItems.filter(i => i.tipo === currentTab).map(i => i.categoria).filter(Boolean))].sort();
            select.innerHTML = '<option value="">Todas as Categorias</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
            select.value = val;
        }

        window.toggleFixar = function(id) {
            const idx = allItems.findIndex(i => i.id === id);
            if (idx !== -1) { allItems[idx].fixado = !allItems[idx].fixado; saveToLocalStorage(); }
        }

        document.getElementById('itemForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const valorInput = document.getElementById('valorMercado').value;
            
            const data = {
                tipo: currentTab, 
                nome: document.getElementById('nome').value.trim(),
                patrimonio: currentTab === 'equipamentos' ? document.getElementById('patrimonio').value.trim() : '',
                categoria: document.getElementById('categoria').value.trim(),
                quantidade: parseFloat(document.getElementById('quantidade').value), 
                unidade: document.getElementById('unidade').value.trim(),
                ambiente: document.getElementById('ambiente').value, 
                valorMercado: valorInput ? parseFloat(valorInput) : null,
                situacao: document.getElementById('situacao').value,
                observacoes: document.getElementById('observacoes').value.trim()
            };

            if (id) {
                const idx = allItems.findIndex(i => i.id === id);
                if (idx !== -1) { data.fixado = allItems[idx].fixado; allItems[idx] = { ...allItems[idx], ...data }; }
            } else {
                data.id = Date.now().toString(); data.fixado = false; allItems.push(data);
            }
            saveToLocalStorage(); closeModal();
        });

        document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
            if (itemToDeleteId) { allItems = allItems.filter(i => i.id !== itemToDeleteId); saveToLocalStorage(); closeConfirmModal(); }
        });

        ['searchInput', 'filterAmbiente', 'filterSituacao', 'filterCategoria'].forEach(id => 
            document.getElementById(id).addEventListener(id === 'searchInput' ? 'input' : 'change', renderTable)
        );

        window.openModal = function() {
            const modal = document.getElementById('itemModal'), content = document.getElementById('itemModalContent');
            document.getElementById('itemForm').reset();
            document.getElementById('modalTitle').innerHTML = `<i class="ph-fill ph-box-arrow-down"></i> Adicionar Novo ${currentTab === 'equipamentos' ? 'Equipamento' : 'Insumo'}`;
            document.getElementById('itemId').value = ''; 
            document.getElementById('situacao').value = 'OK';
            document.getElementById('patrimonioContainer').classList.toggle('hidden', currentTab !== 'equipamentos');
            
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        }

        window.editItem = function(id) {
            const item = allItems.find(i => i.id === id); if (!item) return;
            const modal = document.getElementById('itemModal'), content = document.getElementById('itemModalContent');
            
            document.getElementById('modalTitle').innerHTML = `<i class="ph-fill ph-pencil-simple"></i> Editar ${currentTab === 'equipamentos' ? 'Equipamento' : 'Insumo'}`;
            ['itemId', 'nome', 'patrimonio', 'categoria', 'quantidade', 'unidade', 'ambiente', 'valorMercado', 'situacao', 'observacoes'].forEach(field => {
                if(document.getElementById(field)) document.getElementById(field).value = item[field] || '';
            });
            document.getElementById('patrimonioContainer').classList.toggle('hidden', currentTab !== 'equipamentos');
            
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        }

        window.closeModal = function() {
            const modal = document.getElementById('itemModal'), content = document.getElementById('itemModalContent');
            modal.classList.add('opacity-0'); content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        window.requestDelete = function(id) {
            itemToDeleteId = id;
            const modal = document.getElementById('confirmModal'), content = document.getElementById('confirmModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        }

        window.closeConfirmModal = function() {
            const modal = document.getElementById('confirmModal'), content = document.getElementById('confirmModalContent');
            modal.classList.add('opacity-0'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); itemToDeleteId = null; }, 200);
        }

        // EXPORTAÇÃO XLSX PROFISSIONAL USANDO XLSX-JS-STYLE
        window.exportarExcelCompleto = function() {
            if(typeof XLSX === 'undefined') {
                alert("A biblioteca de exportação ainda está a carregar. Tente novamente em alguns segundos.");
                return;
            }

            if (allItems.length === 0) {
                alert("Não há itens no estoque para exportar.");
                return;
            }

            // Agrupar itens por Ambiente
            const groupedByAmbiente = allItems.reduce((acc, item) => {
                const ambiente = item.ambiente || 'Sem Ambiente';
                if (!acc[ambiente]) acc[ambiente] = [];
                acc[ambiente].push(item);
                return acc;
            }, {});

            // Criar um Workbook vazio
            const wb = XLSX.utils.book_new();

            // Adicionar uma aba geral (Todos os Itens) primeiro
            const allDataFormatted = formatarParaExcel(allItems);
            const wsTodos = XLSX.utils.json_to_sheet(allDataFormatted);
            estilizarPlanilha(wsTodos, allDataFormatted);
            XLSX.utils.book_append_sheet(wb, wsTodos, "Geral (Todos)");

            // Adicionar uma aba para cada Ambiente
            Object.keys(groupedByAmbiente).sort().forEach(ambiente => {
                const sheetName = ambiente.substring(0, 31).replace(/[\[\]\*\\\?\:\/]/g, ''); 
                const dataFormatted = formatarParaExcel(groupedByAmbiente[ambiente]);
                const ws = XLSX.utils.json_to_sheet(dataFormatted);
                
                estilizarPlanilha(ws, dataFormatted);
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
            });

            // Gerar e baixar o arquivo
            const dataHoje = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
            XLSX.writeFile(wb, `Controle_Estoque_SENAI_${dataHoje}.xlsx`);
        };

        function formatarParaExcel(dados) {
            return dados.map(i => ({
                "Tipo": i.tipo === 'equipamentos' ? 'Equipamento' : 'Insumo',
                "Património": i.patrimonio || '-',
                "Nome do Item": i.nome,
                "Categoria": i.categoria,
                "Qtd": i.quantidade,
                "Unidade": i.unidade,
                "Ambiente": i.ambiente,
                "Valor Unitário (R$)": i.valorMercado ? parseFloat(i.valorMercado) : 0,
                "Situação": i.situacao,
                "Observações": i.observacoes || ''
            }));
        }

        function estilizarPlanilha(ws, dados) {
            if(dados.length === 0) return;
            
            // Ajustar largura das colunas baseadas no conteúdo
            const colWidths = Object.keys(dados[0]).map(key => {
                let max = key.toString().length;
                dados.forEach(row => {
                    const cellVal = row[key] !== null && row[key] !== undefined ? row[key].toString() : "";
                    if(cellVal.length > max) max = cellVal.length;
                });
                return { wch: Math.min(max + 3, 50) }; // Padding extra e limite max de 50
            });
            ws['!cols'] = colWidths;

            // Decodificar o range para aplicar estilos célula a célula
            const range = XLSX.utils.decode_range(ws['!ref']);

            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!ws[cellRef]) continue;

                    // Estilo padrão da célula
                    ws[cellRef].s = {
                        font: { name: "Calibri", sz: 11 },
                        alignment: { vertical: "center" }
                    };

                    if (R === 0) {
                        // CABEÇALHO: Fundo Azul SENAI, Texto Branco e Negrito
                        ws[cellRef].s.fill = { fgColor: { rgb: "002E5F" } };
                        ws[cellRef].s.font.color = { rgb: "FFFFFF" };
                        ws[cellRef].s.font.bold = true;
                        ws[cellRef].s.alignment.horizontal = "center";
                    } else {
                        // LINHAS ZEBRADAS: Branco e Azul muito clarinho (AliceBlue)
                        const isEvenRow = R % 2 === 0;
                        ws[cellRef].s.fill = { fgColor: { rgb: isEvenRow ? "F2F8FF" : "FFFFFF" } };
                        
                        // Formatar coluna "Valor Unitário" (Índice 7) como Moeda Contábil
                        if (C === 7 && typeof ws[cellRef].v === 'number') {
                            ws[cellRef].s.numFmt = '"R$" #,##0.00';
                        }
                    }
                }
            }
        }

        switchTab(currentTab);
    </script>
</body>
